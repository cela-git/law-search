<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>법령 통합 검색</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<!--
  ============================================================================
  법령 통합 검색 (아임웹 코드 위젯 / GitHub Pages iframe 공용 단일 파일)
  - 순수 HTML/CSS/JS. 외부 라이브러리·백엔드·DB 없음.
  - 법령 데이터(manifest.json + laws/*.md)는 아래 CONFIG.DATA_BASE_URL 위치에서 fetch.
  ----------------------------------------------------------------------------
  ▶ 배포 방법 두 가지 (상세계획서 3.3)
   1) iframe 대안(권장·무유지보수): 이 파일을 GitHub Pages 저장소 루트에
      index.html 로 올리면 DATA_BASE_URL = '' 그대로 동작(같은 폴더의
      manifest.json·laws/ 를 읽음). 아임웹에는 <iframe src="...github.io/저장소/">
      한 줄만 넣는다.
   2) 코드 위젯 기본안: 아래 <style>부터 </script>까지(또는 이 파일 전체)를
      아임웹 일반 "코드 위젯"에 붙여넣는다. 이때는 데이터가 다른 도메인
      (GitHub Pages)에 있으므로 아래 DATA_BASE_URL 을 반드시
      'https://<계정>.github.io/<저장소>/' 로 바꾼다(끝에 / 포함).
  ============================================================================
-->
<style>
@import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@latest/dist/web/variable/pretendardvariable-dynamic-subset.css");
/* ── 스타일 격리: 모든 규칙은 #lawapp-root 하위로만 적용 (아임웹 테마와 분리) ──
   디자인 시스템: CELA(사이트) 일관성 — Pretendard / 네이비 #0f172a / 브랜드 블루 #2563eb */
#lawapp-root{
  --lawapp-height: 100vh;
  --c-bg:#f8fafc; --c-panel:#ffffff; --c-border:#e2e8f0; --c-border-strong:#cbd5e1;
  --c-text:#0f172a; --c-sub:#64748b; --c-accent:#2563eb; --c-accent-weak:#eff6ff;
  --c-mark:#fef08a; --c-mark-cur:#fde047; --c-pulse:#dbeafe; --c-badge:#f1f5f9;
  --c-select:#98FB98;
  --c-danger:#dc2626;
  --shadow-sm:0 1px 3px rgba(15,23,42,.06); --shadow-md:0 8px 24px rgba(15,23,42,.10);
  --radius:12px; --results-w:312px;
  position:relative; height:var(--lawapp-height); min-height:560px;
  display:flex; flex-direction:column;
  font-family:"Pretendard",-apple-system,BlinkMacSystemFont,system-ui,Roboto,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  color:var(--c-text); background:var(--c-bg); font-size:15px; line-height:1.6;
  letter-spacing:-0.01em; -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
  -webkit-text-size-adjust:100%;
}
#lawapp-root ::-webkit-scrollbar{ width:10px; height:10px; }
#lawapp-root ::-webkit-scrollbar-thumb{ background:#cbd5e1; border-radius:8px; border:2px solid transparent; background-clip:content-box; }
#lawapp-root ::-webkit-scrollbar-thumb:hover{ background:#94a3b8; background-clip:content-box; }
#lawapp-root ::-webkit-scrollbar-track{ background:transparent; }
#lawapp-root *{ box-sizing:border-box; margin:0; padding:0; }
#lawapp-root button{ font:inherit; color:inherit; cursor:pointer; background:none; border:none; }
#lawapp-root select{ font:inherit; color:inherit; }

/* 상단 바 */
#lawapp-root .lawapp-topbar{
  flex:0 0 auto; display:flex; align-items:center; gap:14px;
  padding:12px 20px; background:var(--c-panel); border-bottom:1px solid var(--c-border);
  flex-wrap:wrap; box-shadow:var(--shadow-sm); z-index:2;
}
#lawapp-root .lawapp-brand{ font-weight:700; font-size:14.5px; white-space:nowrap; display:flex; align-items:center; gap:6px; letter-spacing:-0.02em; color:var(--c-text); }
#lawapp-root .lawapp-brand .lawapp-logo{ font-size:17px; line-height:1; color:var(--c-accent); }
#lawapp-root .lawapp-searchwrap{ position:relative; flex:0 1 230px; max-width:270px; min-width:150px; }
#lawapp-root .lawapp-searchwrap input{
  width:100%; padding:6px 28px 6px 29px; font-size:13.5px; font-family:inherit; color:var(--c-text);
  border:1px solid var(--c-border-strong); border-radius:9px; background:#fff;
  transition:border-color .2s ease, box-shadow .2s ease;
}
#lawapp-root .lawapp-searchwrap input::placeholder{ color:#94a3b8; }
#lawapp-root .lawapp-searchwrap input:focus{ outline:none; border-color:var(--c-accent); box-shadow:0 0 0 3px rgba(37,99,235,.15); }
#lawapp-root .lawapp-searchwrap .lawapp-search-icon{ position:absolute; left:9px; top:50%; transform:translateY(-50%); color:var(--c-sub); font-size:12px; pointer-events:none; }
#lawapp-root .lawapp-search-clear{ position:absolute; right:6px; top:50%; transform:translateY(-50%); width:20px; height:20px; border-radius:50%; color:var(--c-sub); font-size:14px; line-height:1; display:none; align-items:center; justify-content:center; }
#lawapp-root .lawapp-search-clear:hover{ background:var(--c-badge); }
#lawapp-root .lawapp-searchwrap.has-text .lawapp-search-clear{ display:flex; }

/* 검색 모드 세그먼트 (간단 라벨 + title 툴팁) — 검색창 옆 같은 줄 */
#lawapp-root .lawapp-segment{ flex:0 0 auto; display:inline-flex; background:var(--c-bg); border:1px solid var(--c-border); border-radius:9px; padding:2px; gap:2px; }
#lawapp-root .lawapp-segment button{ position:relative; font:inherit; font-size:12px; font-weight:600; cursor:pointer; background:transparent; color:var(--c-sub); padding:4px 9px; border:1px solid transparent; border-radius:7px; letter-spacing:-0.01em; white-space:nowrap; transition:color .12s ease, background .12s ease, border-color .12s ease; }
#lawapp-root .lawapp-segment button:hover{ color:var(--c-text); }
#lawapp-root .lawapp-segment button.active{ background:#fff; color:var(--c-accent); box-shadow:0 1px 2px rgba(15,23,42,.10); border-color:#dbe5f5; }
/* 빠른 커스텀 툴팁 (네이티브 title의 느린 지연 대신 ~40ms) */
#lawapp-root .lawapp-segment button[data-tip]::after{ content:attr(data-tip); position:absolute; top:calc(100% + 7px); left:0; z-index:50; width:max-content; max-width:230px; white-space:normal; text-align:left; background:#0f172a; color:#fff; font-size:11.5px; font-weight:500; line-height:1.45; letter-spacing:-0.01em; padding:6px 9px; border-radius:7px; box-shadow:0 6px 16px rgba(15,23,42,.20); opacity:0; visibility:hidden; transform:translateY(-2px); transition:opacity .1s ease, transform .1s ease, visibility .1s ease; transition-delay:.04s; pointer-events:none; }
#lawapp-root .lawapp-segment button[data-tip]:hover::after{ opacity:1; visibility:visible; transform:translateY(0); }

/* 법령별 토글 배지 (ex5 swatch, 라이트) — 검색·모드 옆 같은 줄 */
#lawapp-root .lawapp-lawbadges{ flex:1 1 auto; min-width:0; display:flex; align-items:center; gap:5px; flex-wrap:wrap; }
#lawapp-root .lawapp-badges-label{ font-size:11.5px; color:var(--c-sub); font-weight:600; margin-right:1px; white-space:nowrap; }
#lawapp-root .lawapp-lawbadge{ position:relative; display:inline-flex; align-items:center; gap:5px; padding:2px 8px 2px 7px; border:1px solid var(--c-border); border-radius:100px; background:#fff; font-size:11.5px; font-weight:500; color:var(--c-sub); cursor:pointer; transition:all .12s ease; }
/* 배지 풀네임 빠른 커스텀 툴팁 (세그먼트와 동일, 배지 아래 중앙 정렬) */
#lawapp-root .lawapp-lawbadge[data-tip]::after{ content:attr(data-tip); position:absolute; top:calc(100% + 7px); left:50%; z-index:50; width:max-content; max-width:260px; white-space:nowrap; text-align:center; background:#0f172a; color:#fff; font-size:11.5px; font-weight:500; line-height:1.45; letter-spacing:-0.01em; padding:5px 9px; border-radius:7px; box-shadow:0 6px 16px rgba(15,23,42,.20); opacity:0; visibility:hidden; transform:translate(-50%,-2px); transition:opacity .1s ease, transform .1s ease, visibility .1s ease; transition-delay:.04s; pointer-events:none; }
#lawapp-root .lawapp-lawbadge[data-tip]:hover::after{ opacity:1; visibility:visible; transform:translate(-50%,0); }
#lawapp-root .lawapp-lawbadge-dot{ width:7px; height:7px; border-radius:50%; background:#cbd5e1; flex:none; }
#lawapp-root .lawapp-lawbadge-nm{ white-space:nowrap; }
#lawapp-root .lawapp-lawbadge-cnt{ font-size:10.5px; font-weight:700; font-variant-numeric:tabular-nums; color:var(--c-sub); background:var(--c-bg); border-radius:100px; padding:0 5px; }
#lawapp-root .lawapp-lawbadge:hover{ border-color:var(--c-border-strong); color:var(--c-text); }
#lawapp-root .lawapp-lawbadge.on{ color:var(--lawc,var(--c-accent)); border-color:var(--lawc,var(--c-accent)); background:#fff; background:color-mix(in srgb, var(--lawc,var(--c-accent)) 8%, #fff); }
#lawapp-root .lawapp-lawbadge.on .lawapp-lawbadge-dot{ background:var(--lawc,var(--c-accent)); }
#lawapp-root .lawapp-lawbadge.on .lawapp-lawbadge-cnt{ background:var(--lawc,var(--c-accent)); color:#fff; }
#lawapp-root .lawapp-lawbadge.off{ opacity:.72; }
/* 검색 중: 결과 있는 법령(미선택)은 색으로 도드라지게, 0건 법령은 더 흐리게 */
#lawapp-root .lawapp-lawbadge.off.zero{ opacity:.4; }
#lawapp-root .lawapp-lawbadge.off.has{ opacity:1; color:var(--c-text); border-color:var(--c-border-strong); }
#lawapp-root .lawapp-lawbadge.off.has .lawapp-lawbadge-dot{ background:var(--lawc,var(--c-accent)); }
#lawapp-root .lawapp-lawbadge.off.has .lawapp-lawbadge-cnt{ color:var(--lawc,var(--c-accent)); background:color-mix(in srgb, var(--lawc,var(--c-accent)) 13%, #fff); font-weight:700; }

#lawapp-root .lawapp-loading{ flex-basis:100%; font-size:13px; color:var(--c-sub); display:none; }
#lawapp-root .lawapp-loading.show{ display:block; }
#lawapp-root .lawapp-loading .lawapp-bar{ display:inline-block; height:6px; width:140px; background:var(--c-badge); border-radius:3px; vertical-align:middle; overflow:hidden; margin-left:8px; }
#lawapp-root .lawapp-loading .lawapp-bar span{ display:block; height:100%; background:var(--c-accent); width:0%; transition:width .25s; }

#lawapp-root .lawapp-banner{ flex:0 0 auto; display:none; padding:9px 18px; background:#fef2f2; color:var(--c-danger); border-bottom:1px solid #fecaca; font-size:13.5px; font-weight:500; }
#lawapp-root .lawapp-banner.show{ display:block; }

/* 본문 영역 */
#lawapp-root .lawapp-main{ flex:1 1 auto; min-height:0; display:flex; position:relative; }
/* 결과 패널 접혔을 때 다시 펼치는 좌측 탭 (꺾쇠) */
#lawapp-root .lawapp-results-reopen{ display:none; position:absolute; left:0; top:12px; z-index:6; width:20px; height:50px; border:1px solid var(--c-border); border-left:none; border-radius:0 9px 9px 0; background:var(--c-panel); color:var(--c-sub); font-size:14px; box-shadow:var(--shadow-sm); align-items:center; justify-content:center; }
#lawapp-root .lawapp-results-reopen:hover{ color:var(--c-accent); border-color:var(--c-accent); }
#lawapp-root .lawapp-results-reopen.show{ display:flex; }

/* 결과 패널 (ex3: 분야 ▸ 법령 2단 그룹) */
#lawapp-root .lawapp-results{
  flex:0 0 var(--results-w,312px); width:var(--results-w,312px); background:var(--c-panel); border-right:1px solid var(--c-border);
  display:none; flex-direction:column; min-height:0;
}
#lawapp-root .lawapp-results.show{ display:flex; }
/* 결과 패널 너비 드래그 리사이저 */
#lawapp-root .lawapp-results-resizer{ flex:0 0 6px; margin-left:-3px; cursor:col-resize; position:relative; z-index:5; display:none; touch-action:none; }
#lawapp-root .lawapp-results-resizer.show{ display:block; }
#lawapp-root .lawapp-results-resizer::before{ content:""; position:absolute; left:2px; top:0; bottom:0; width:2px; background:transparent; transition:background .12s ease; }
#lawapp-root .lawapp-results-resizer:hover::before,#lawapp-root .lawapp-results-resizer.dragging::before{ background:var(--c-accent); }
#lawapp-root .lawapp-results-head{ flex:0 0 auto; display:flex; align-items:center; gap:8px; padding:9px 10px 9px 14px; border-bottom:1px solid var(--c-border); }
#lawapp-root .lawapp-results-head .lawapp-rh-ttl{ flex:1 1 auto; font-size:13.5px; font-weight:700; color:var(--c-text); }
#lawapp-root .lawapp-results-head .lawapp-rh-meta{ font-size:11.5px; color:var(--c-sub); white-space:nowrap; }
#lawapp-root .lawapp-results-collapse{ flex:none; width:24px; height:24px; border-radius:6px; color:var(--c-sub); font-size:16px; line-height:1; display:flex; align-items:center; justify-content:center; }
#lawapp-root .lawapp-results-collapse:hover{ background:var(--c-badge); color:var(--c-text); }
#lawapp-root .lawapp-results-scroll{ flex:1 1 auto; min-height:0; overflow-y:auto; padding:4px 0 10px; }

/* 법령별 바로가기 칩 (누르면 아래 결과 목록에서 그 법령 위치로 점프) */
#lawapp-root .lawapp-results-jump{ flex:0 0 auto; display:flex; flex-wrap:wrap; gap:5px; padding:8px 12px; border-bottom:1px solid var(--c-border); background:var(--c-bg); }
#lawapp-root .lawapp-jump-chip{ display:inline-flex; align-items:center; gap:5px; padding:3px 9px 3px 8px; border:1px solid var(--c-border); border-radius:100px; background:#fff; font-size:11.5px; font-weight:600; color:var(--c-text); cursor:pointer; transition:all .12s ease; max-width:100%; }
#lawapp-root .lawapp-jump-chip:hover{ border-color:var(--lawc,var(--c-accent)); background:color-mix(in srgb, var(--lawc,var(--c-accent)) 7%, #fff); }
#lawapp-root .lawapp-jump-dot{ width:7px; height:7px; border-radius:50%; background:var(--lawc,#94a3b8); flex:none; }
#lawapp-root .lawapp-jump-nm{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#lawapp-root .lawapp-jump-cnt{ font-size:10.5px; font-weight:700; color:var(--lawc,var(--c-sub)); flex:none; }

/* 분야 밴드 (상위 1단계, sticky) */
#lawapp-root .lawapp-field-head{ position:sticky; top:0; z-index:2; display:flex; align-items:center; gap:8px; padding:7px 14px; font-size:12px; font-weight:700; color:var(--fc,#475569); background:color-mix(in srgb, var(--fc,#475569) 8%, #fff); }
#lawapp-root .lawapp-field-head .lawapp-fbar{ width:3px; height:14px; border-radius:2px; background:var(--fc,#475569); flex:none; }
#lawapp-root .lawapp-field-head .lawapp-fnm{ flex:none; }
/* 스크롤 위치의 하위법 표기 '› 시행령' (본법 구간에선 빈 값 → 숨김). '›'는 ::before로 띄워 붙음 방지 */
#lawapp-root .lawapp-field-head .lawapp-fcur{ flex:0 1 auto; min-width:0; font-weight:700; color:var(--fc,#475569); opacity:.9; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#lawapp-root .lawapp-field-head .lawapp-fcur:not(:empty)::before{ content:'›'; margin-right:7px; font-weight:700; opacity:.55; }
#lawapp-root .lawapp-field-head .lawapp-fcur:empty{ display:none; }
#lawapp-root .lawapp-field-head .lawapp-fct{ margin-left:auto; padding-left:8px; font-size:11px; font-weight:600; opacity:.85; flex:none; }

/* 법령 소그룹 (하위 2단계, 들여쓰기) */
#lawapp-root .lawapp-law-head{ display:flex; align-items:center; gap:7px; padding:7px 14px 4px 22px; }
#lawapp-root .lawapp-law-head .lawapp-ldot{ width:8px; height:8px; border-radius:50%; flex:none; background:var(--lawc,#94a3b8); }
#lawapp-root .lawapp-law-head .lawapp-lname{ font-size:12.5px; font-weight:600; color:var(--c-text); min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#lawapp-root .lawapp-law-head .lawapp-labbr{ font-size:10px; font-weight:700; color:#fff; background:var(--lawc,#94a3b8); border-radius:100px; padding:1px 7px; line-height:1.4; flex:none; }
#lawapp-root .lawapp-law-head .lawapp-lcount{ margin-left:auto; font-size:11px; color:var(--c-sub); font-weight:600; flex:none; }

#lawapp-root .lawapp-item{ display:block; width:100%; text-align:left; padding:5px 14px 6px 22px; margin-left:7px; border-left:2px solid var(--lawc,transparent); background:none; cursor:pointer; transition:background .12s ease; word-break:keep-all; }
#lawapp-root .lawapp-item:hover{ background:var(--c-bg); }
/* 클릭해 선택된 결과(법령별 1개씩 유지) — 본문 타깃 강조와 같은 위치 */
#lawapp-root .lawapp-item.selected{ background:color-mix(in srgb, var(--lawc,var(--c-accent)) 13%, #fff); border-left-width:3px; }
#lawapp-root .lawapp-item.selected:hover{ background:color-mix(in srgb, var(--lawc,var(--c-accent)) 18%, #fff); }
#lawapp-root .lawapp-item.selected .lawapp-item-jo{ color:var(--lawc,var(--c-accent)); }
#lawapp-root .lawapp-item .lawapp-item-jo{ font-size:12.5px; font-weight:600; color:var(--c-text); margin-bottom:1px; }
#lawapp-root .lawapp-item .lawapp-item-ex{ font-size:11.5px; color:var(--c-sub); line-height:1.45; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
#lawapp-root .lawapp-item mark{ background:var(--c-mark); color:inherit; padding:0 1px; border-radius:2px; }
#lawapp-root .lawapp-rmore{ display:block; width:100%; text-align:left; padding:5px 14px 8px 22px; font-size:12px; color:var(--c-accent); font-weight:600; }
#lawapp-root .lawapp-rmore:hover{ text-decoration:underline; }
#lawapp-root .lawapp-noresult{ padding:24px 16px; color:var(--c-sub); font-size:13.5px; text-align:center; }

/* 열 컨테이너 — 열이 적으면 균등 분할, 많으면(최대 10) 가로 스크롤 */
#lawapp-root .lawapp-columns{ flex:1 1 auto; min-width:0; display:flex; gap:1px; background:var(--c-border); overflow-x:auto; }
#lawapp-root .lawapp-col{ flex:1 0 340px; min-width:340px; display:flex; flex-direction:column; background:var(--c-panel); position:relative; }

/* 열 머리 */
#lawapp-root .lawapp-col-head{ flex:0 0 auto; padding:10px 12px; border-bottom:1px solid var(--c-border); display:flex; flex-direction:column; gap:8px; background:var(--c-bg); }
#lawapp-root .lawapp-col-head-row1{ display:flex; align-items:center; gap:8px; }
#lawapp-root .lawapp-col-title{ flex:1 1 auto; min-width:0; display:flex; align-items:center; gap:8px; }
#lawapp-root .lawapp-col-bar{ width:4px; height:18px; border-radius:2px; background:var(--lawc,var(--c-accent)); flex:none; }
#lawapp-root .lawapp-col-name{ font-size:15px; font-weight:700; letter-spacing:-0.015em; color:var(--c-text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#lawapp-root .lawapp-typebadge{ border-radius:100px; padding:2px 9px; font-size:11px; font-weight:600; white-space:nowrap; color:var(--lawc,var(--c-accent)); background:var(--c-accent-weak); background:color-mix(in srgb, var(--lawc,var(--c-accent)) 12%, #fff); }
#lawapp-root .lawapp-col-close{ flex:0 0 auto; width:26px; height:26px; border-radius:6px; color:var(--c-sub); font-size:17px; line-height:1; }
#lawapp-root .lawapp-col-close:hover{ background:var(--c-badge); color:var(--c-danger); }
#lawapp-root .lawapp-col-head-row2{ display:flex; align-items:center; gap:6px; font-size:12px; color:var(--c-sub); flex-wrap:wrap; }
#lawapp-root .lawapp-enforced{ white-space:nowrap; font-weight:500; }
#lawapp-root .lawapp-badge{ background:var(--c-accent-weak); color:var(--c-accent); border:1px solid rgba(37,99,235,.15); border-radius:100px; padding:2px 9px; font-size:11px; font-weight:600; white-space:nowrap; }
#lawapp-root .lawapp-chip{ display:inline-flex; align-items:center; gap:3px; padding:3px 10px; border:1px solid var(--c-border); border-radius:100px; background:#fff; font-size:11.5px; color:var(--c-sub); font-weight:500; transition:all .2s ease; text-decoration:none; }
#lawapp-root .lawapp-chip:hover{ border-color:var(--c-accent); color:var(--c-accent); background:var(--c-accent-weak); }
#lawapp-root .lawapp-matchnav{ display:none; align-items:center; gap:4px; margin-left:auto; }

/* 본문 기본 = 마커(①·1.·가.) 없는 본문(부칙 본문·단일 문단 조문 등).

   text-indent = 머리기호 폭(음수)이라 둘째 줄부터 첫 문장 시작 위치에 딱 맞음. padding-left로 단계 들여쓰기. */

<body>
<div id="lawapp-root">
  <div class="lawapp-topbar">
    <div class="lawapp-brand"><span class="lawapp-logo">⚖</span><span>법령 통합 검색</span></div>
    <div class="lawapp-searchwrap" id="lawapp-searchwrap">
      <span class="lawapp-search-icon">🔍</span>
      <input id="lawapp-search" type="text" placeholder="키워드·문장 검색 (예: 침해사고)" autocomplete="off" spellcheck="false" aria-label="법령 검색">
      <button class="lawapp-search-clear" id="lawapp-search-clear" title="지우기" aria-label="검색어 지우기">✕</button>
    </div>
    <div class="lawapp-segment" id="lawapp-segment" role="tablist" aria-label="검색 모드">
      <button type="button" data-mode="exact" data-tip="정확히 — 공백·글자까지 그대로 일치하는 결과만" aria-label="정확히">정확</button>
      <button type="button" class="active" data-mode="loose" aria-selected="true" data-tip="띄어쓰기 무시 — '개 인정보'처럼 띄어 써도 매칭 (기본)" aria-label="띄어쓰기 무시">공백무시</button>
      <button type="button" data-mode="phrase" data-tip="문장 포함 — 한 줄에 모든 단어가 들어가면 매칭 (순서 무관)" aria-label="문장 포함">문장</button>
    </div>
    <div class="lawapp-lawbadges" id="lawapp-lawbadges"></div>
    <div class="lawapp-loading" id="lawapp-loading">법령 불러오는 중 <span id="lawapp-load-count">0/0</span><span class="lawapp-bar"><span id="lawapp-load-fill"></span></span></div>
  </div>
  <div class="lawapp-banner" id="lawapp-banner"></div>
  <div class="lawapp-main">
    <div class="lawapp-results" id="lawapp-results"></div>
    <div class="lawapp-results-resizer" id="lawapp-results-resizer" title="드래그하여 너비 조절" aria-label="검색 결과 너비 조절"></div>
    <button class="lawapp-results-reopen" id="lawapp-results-reopen" title="검색 결과 보기" aria-label="검색 결과 보기">›</button>
    <div class="lawapp-columns" id="lawapp-columns"></div>
  </div>
  <div class="lawapp-footnote">본 서비스는 참고용입니다. 법적 효력의 기준은 국가법령정보센터(law.go.kr) 원문입니다. 별표·서식의 실제 내용은 각 열의 “원문” 링크에서 확인하세요.</div>
</div>

<script>
"use strict";
(function(){

/* =========================================================================
   CONFIG — 배포 시 여기만 확인/수정하면 됩니다.
   - iframe 대안(같은 폴더에 manifest.json 이 있는 경우): '' 그대로.
   - 아임웹 코드 위젯에 직접 붙여넣는 경우: 'https://<계정>.github.io/<저장소>/'
   ========================================================================= */
// 법령 데이터(manifest.json·laws/)가 있는 GitHub Pages 주소 — 저장소가 정해지면 이 한 줄만 맞추세요.
var GITHUB_PAGES_URL = 'https://cela-git.github.io/law-search/';   // 끝에 '/' 포함
var CONFIG = {
  // 데이터 위치 자동 선택 (한 파일로 GitHub·아임웹 양쪽에서 동작):
  //  · GitHub Pages·로컬에서 열리면 → 같은 폴더(상대경로)에서 로드
  //  · 아임웹 코드 위젯 등 다른 도메인에서 열리면 → 위 GitHub Pages 주소에서 로드
  DATA_BASE_URL: (/(^|\.)github\.io$/.test(location.hostname)
                  || /^(localhost|127\.0\.0\.1|\[?::1\]?)$/.test(location.hostname)
                  || location.protocol === 'file:') ? '' : GITHUB_PAGES_URL,
  DEFAULT_COLUMNS: 2,
  RESULTS_PER_LAW: 30,        // 법령당 결과 패널에 표시할 '조문' 수 (초과분은 더보기)
  DEBOUNCE_MS: 200,
  FETCH_TIMEOUT_MS: 15000,    // 네트워크 무응답 시 중단 시간
  LS_KEY: 'lawapp:v1'
};

// 열은 최대 10개. 첫 방문 시 자동으로 열어 둘 법령 수(0 = 빈 상태로 시작).
var MAX_COLUMNS = 10;
var DEFAULT_OPEN = 0;

/* 법령별 색·약칭·계열 — 결과/배지/열 헤더의 법령 구분에 사용.
   manifest를 건드리지 않으려고 코드에 둡니다(개정 시 AI가 만든 manifest를 그대로 써도 표시 유지).
   ▶ 새 법령을 추가하면 여기에 한 줄만 더해 주세요. 없으면 약칭=short, 색=자동 팔레트로 대체됩니다.
   ▶ family/sub: 본법과 하위(시행령·시행규칙·고시)를 'family › sub' 빵부스러기로 묶어 표시.
     본법은 family만, 하위는 sub까지. 생략하면 short 이름에서 '○○법 시행령/시행규칙'을 자동 추론. */
var LAW_STYLE = {
  ICN_ACT:    { abbr:'망법',   color:'#1d4ed8', family:'정보통신망법' },
  ICN_DECREE: { abbr:'망령',   color:'#3b82f6', family:'정보통신망법', sub:'시행령' },
  ICN_RULE:   { abbr:'망칙',   color:'#60a5fa', family:'정보통신망법', sub:'시행규칙' },
  PIPA_ACT:   { abbr:'개보법', color:'#0f766e', family:'개인정보 보호법' },
  PIPA_DECREE:{ abbr:'개보령', color:'#14b8a6', family:'개인정보 보호법', sub:'시행령' },
  PIPA_SAFETY_STANDARD: { abbr:'안전조치', color:'#d97706', family:'개인정보 보호법', sub:'안전성 확보조치 기준' }
};
var FALLBACK_COLORS = ['#2563eb','#0f766e','#d97706','#7c3aed','#dc2626','#0891b2','#4338ca','#15803d'];
// 분야(카테고리) 대표 색 — 결과 패널의 분야 밴드(ex3)에 사용. 없으면 그 분야 첫 법령 색으로 대체.
var CATEGORY_STYLE = { '정보통신':'#1d4ed8', '개인정보':'#0f766e' };

// ===== __LOGIC_START__ (순수 로직: 파서·검색 — DOM 비의존, 단위 테스트 대상) =====

// 검색용 정규화: 공백 제거 + 소문자화. norm 문자열과 원본 인덱스 역매핑(map) 반환.
function normalizeWithMap(text){
  var norm = '', map = [];
  for (var i=0; i<text.length; i++){
    var ch = text[i];
    if (/\s/.test(ch)) continue;
    var low = ch.toLowerCase();
    for (var j=0; j<low.length; j++){ norm += low[j]; map.push(i); }
  }
  return { norm: norm, map: map };
}

// 외부(법령 프런트매터)에서 온 URL을 a.href에 넣기 전 스킴 화이트리스트 검증.
// http/https만 허용, javascript:·data: 등은 null 반환 (DOM XSS 차단).
function safeHttpUrl(u, base){
  if (u == null) return null;
  var b = base || ((typeof location !== 'undefined' && location.href) ? location.href : 'https://example.org/');
  try { var p = new URL(String(u), b); return (p.protocol === 'http:' || p.protocol === 'https:') ? p.href : null; }
  catch (e) { return null; }
}

function buildQuery(raw){
  var trimmed = (raw == null ? '' : String(raw)).trim();
  var phraseNorm = trimmed.toLowerCase().replace(/\s+/g,'');
  var tokens = trimmed.split(/\s+/).filter(Boolean).map(function(t){ return t.toLowerCase().replace(/\s+/g,''); });
  return { raw: trimmed, phraseNorm: phraseNorm, tokens: tokens };
}

function allOccurrences(haystack, needle){
  var out = [], from = 0, idx;
  if (!needle) return out;
  while ((idx = haystack.indexOf(needle, from)) !== -1){ out.push(idx); from = idx + needle.length; }
  return out;
}

// norm 좌표 [start, start+len) → 원본 텍스트 좌표 [origStart, origEnd)
function origRange(row, normStart, len){
  var s = row.normMap[normStart];
  var e = row.normMap[normStart + len - 1] + 1;
  return [s, e];
}

function mergeRanges(ranges){
  if (ranges.length <= 1) return ranges.slice();
  ranges = ranges.slice().sort(function(a,b){ return a[0]-b[0] || a[1]-b[1]; });
  var out = [ranges[0].slice()];
  for (var i=1; i<ranges.length; i++){
    var last = out[out.length-1], cur = ranges[i];
    if (cur[0] <= last[1]) last[1] = Math.max(last[1], cur[1]);
    else out.push(cur.slice());
  }
  return out;
}

// 한 행이 질의에 매칭되는지 판정. mode: 'exact'|'loose'|'phrase'.
//  exact  = 입력 글자(공백 포함) 그대로 한 줄에 포함
//  loose  = 공백 무시 연속 일치(기본)
//  phrase = 공백으로 나눈 모든 단어가 한 줄에 포함(AND)
// 반환: {match, type, ranges:[[s,e]..](원본좌표)}
function matchRow(row, q, mode){
  mode = mode || 'loose';
  if (!q || !q.raw) return { match:false };
  var ranges = [];
  if (mode === 'exact'){
    var needle = q.raw.toLowerCase();
    var occ = allOccurrences(row.text.toLowerCase(), needle);
    if (!occ.length) return { match:false };
    occ.forEach(function(s){ ranges.push([s, s + needle.length]); });
    return { match:true, type:'exact', ranges: mergeRanges(ranges) };
  }
  var tn = row.textNorm;
  if (mode === 'phrase'){
    if (!q.tokens.length) return { match:false };
    var allIn = q.tokens.every(function(t){ return t && tn.indexOf(t) !== -1; });
    if (!allIn) return { match:false };
    q.tokens.forEach(function(t){ allOccurrences(tn, t).forEach(function(s){ ranges.push(origRange(row, s, t.length)); }); });
    return { match:true, type:'phrase', ranges: mergeRanges(ranges) };
  }
  // loose (기본)
  if (!q.phraseNorm || tn.indexOf(q.phraseNorm) === -1) return { match:false };
  allOccurrences(tn, q.phraseNorm).forEach(function(s){ ranges.push(origRange(row, s, q.phraseNorm.length)); });
  return { match:true, type:'loose', ranges: mergeRanges(ranges) };
}

// 본문 행의 들여쓰기 단계(항·호·목 등) 판정 — 머리 기호로 1~5단계 분류, 그 외는 0(들여쓰기 없음).
//   1: 항  ① ② ③ …(원숫자)
//   2: 호  1. 2. 3. … (가지번호 3의2. 48의3. 포함)
//   3: 목  가. 나. 다. …(한글 한 글자 + 마침표)
//   4: 1) 2) …          5: 가) 나) …
// '의N'(3의2 등 가지번호)을 허용. 연도("2020.")는 \d{1,3} 제한으로, 소수("1.5")는 마침표 뒤 공백/끝 요구로 배제.
function bodyIndentLevel(text){
  var t = String(text);
  if (/^[①-⑳㉑-㉟㊱-㊿⓪]/.test(t)) return 1;        // ①…⑳ ㉑…㉟ ㊱…㊿ ⓪
  if (/^[가-힣](?:의\d{1,3})*\)(\s|$)/.test(t)) return 5;  // 가) 나)
  if (/^\d{1,3}(?:의\d{1,3})*\)(\s|$)/.test(t)) return 4;  // 1) 2) 3의2)
  if (/^[가-힣](?:의\d{1,3})*\.(\s|$)/.test(t)) return 3;  // 가. 나.
  if (/^\d{1,3}(?:의\d{1,3})*\.(\s|$)/.test(t)) return 2;  // 1. 2. 3의2. 48의3.
  return 0;
}

// 조문 헤딩에서 조번호/제목 추출
function parseArticleHeading(text){
  var artNo = '', artTitle = '';
  var mNo = text.match(/^(제\d+조(?:의\d+)?)/);
  if (mNo) artNo = mNo[1];
  var mTitle = text.match(/^제\d+조(?:의\d+)?\s*\(([^)]*)\)/);
  if (mTitle) artTitle = mTitle[1];
  return { artNo: artNo, artTitle: artTitle };
}

// MD 전문 → { meta, rows[], toc[] }
function parseLaw(md, fallbackId){
  md = String(md).replace(/^﻿/, '').replace(/\r\n?/g, '\n');
  var meta = {}, bodyStart = 0;
  var fmMatch = md.match(/^---\n([\s\S]*?)\n---\n?/);
  if (fmMatch){
    fmMatch[1].split('\n').forEach(function(line){
      var m = line.match(/^([A-Za-z0-9_-]+):\s*(.*)$/);
      if (m) meta[m[1]] = m[2].trim();
    });
    bodyStart = fmMatch[0].length;
  }
  if (!meta.id) meta.id = fallbackId || '';

  var lines = md.slice(bodyStart).split('\n');
  var rows = [], toc = [];
  var curSection = '', curSupLabel = '';
  var group = { key:'_pre', label:'' };
  var rowIdx = 0;

  function pushRow(kind, level, text, artNo, artTitle, isHeading){
    var nm = normalizeWithMap(text);
    var row = {
      idx: rowIdx, lawId: meta.id, kind: kind, level: level, text: text,
      isHeading: !!isHeading, artNo: artNo || '', artTitle: artTitle || '',
      section: curSection, groupKey: group.key, groupLabel: group.label,
      textNorm: nm.norm, normMap: nm.map
    };
    rows.push(row);
    rowIdx++;
    return row;
  }

  for (var li=0; li<lines.length; li++){
    var raw = lines[li];
    var line = raw.replace(/\s+$/,'');           // 우측 공백 정리
    if (line.trim() === ''){ continue; }          // 빈 줄은 구조에 영향 없음 → 스킵

    if (line.indexOf('#### ') === 0){             // 부칙 내부 조문
      var t4 = line.slice(5).trim();
      var a4 = parseArticleHeading(t4);
      group = { key:'g'+rowIdx, label:(curSupLabel ? curSupLabel+' ' : '') + t4 };
      var r4 = pushRow('subarticle', 3, t4, a4.artNo, a4.artTitle, true);
      toc.push({ idx:r4.idx, level:3, text:t4 });
    } else if (line.indexOf('### ') === 0){       // 본문 조문
      var t3 = line.slice(4).trim();
      var a3 = parseArticleHeading(t3);
      group = { key:'g'+rowIdx, label:t3 };
      var r3 = pushRow('article', 2, t3, a3.artNo, a3.artTitle, true);
      toc.push({ idx:r3.idx, level:2, text:t3 });
    } else if (line.indexOf('## ') === 0){        // 장/절/관/편 · 부칙 · 별표
      var t2 = line.slice(3).trim();
      var kind, lvl = 1;
      if (t2.indexOf('부칙') === 0){ kind = 'supheading'; curSupLabel = t2; group = { key:'g'+rowIdx, label:t2 }; }
      else if (t2.indexOf('별표') === 0){ kind = 'byeolpyo-heading'; group = { key:'g'+rowIdx, label:t2 }; }
      else { kind = 'section'; curSection = t2; group = { key:'g'+rowIdx, label:t2 }; }
      var r2 = pushRow(kind, 1, t2, '', '', true);
      toc.push({ idx:r2.idx, level:1, text:t2 });
    } else if (/^- \[별[표지]/.test(line)){       // 별표·별지 항목
      var tItem = line.replace(/^- /,'').trim();
      pushRow('byeolpyoitem', 0, tItem, '', '', false);
    } else {                                       // 본문 행 (항·호·목 등)
      var rb = pushRow('body', 0, line.trim(), '', '', false);
      rb.indent = bodyIndentLevel(rb.text);        // 들여쓰기 단계(0~5)
    }
  }
  return { meta: meta, rows: rows, toc: toc };
}

// ===== __LOGIC_END__ =====

/* =========================================================================
   상태
   ========================================================================= */
var state = {
  manifest: null,
  laws: {},            // id -> { meta, rows, toc, loaded, error, manifestMeta }
  order: [],           // 법령 id 배열 (manifest order)
  columns: [],         // 열려 있는 법령들(0~4): { lawId, curMatch, matchPos:[{idx,range}], rowRanges:{idx:ranges}, useTick }
  query: buildQuery(''),
  rawQuery: '',
  useTick: 0,
  resultLimit: {},     // lawId -> shown count
  resultTotals: {},    // lawId -> 매칭 건수 (배지·헤더용, computeResults가 채움)
  searchMode: 'loose', // 'exact'(정확히) | 'loose'(띄어쓰기 무시) | 'phrase'(문장 포함)
  resultsHidden: false,// 좌측 결과 패널 접힘 여부(사용자 토글)
  resultsWidth: 312,   // 좌측 결과 패널 너비(px, 드래그 조절)
  lawView: {}          // lawId -> { line:타깃 강조 행, scrollTop:스크롤 위치 } — 배지 토글로 닫았다 열어도 위치 유지
};

/* =========================================================================
   유틸
   ========================================================================= */
function $(sel, root){ return (root||document).querySelector(sel); }
function el(tag, cls){ var e=document.createElement(tag); if(cls) e.className=cls; return e; }
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function fmtDate(iso){
  if (!iso) return '';
  var m = String(iso).match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (!m) return iso;
  return m[1]+'. '+(+m[2])+'. '+(+m[3])+'.';
}
function buildHighlightHtml(text, ranges, curRange){
  ranges = mergeRanges(ranges || []);
  if (!ranges.length) return escapeHtml(text);
  var html = '', pos = 0;
  for (var i=0; i<ranges.length; i++){
    var s = ranges[i][0], e = ranges[i][1];
    if (s > pos) html += escapeHtml(text.slice(pos, s));
    var isCur = curRange && s < curRange[1] && e > curRange[0];
    html += '<mark class="lawapp-hl'+(isCur?' cur':'')+'">' + escapeHtml(text.slice(s, e)) + '</mark>';
    pos = e;
  }
  if (pos < text.length) html += escapeHtml(text.slice(pos));
  return html;
}
function lawDisplay(id){
  var L = state.laws[id];
  if (!L) return id;
  return (L.manifestMeta && L.manifestMeta.short) || (L.meta && L.meta.short) || id;
}
// 본법(family)과 하위(sub: 시행령·시행규칙·고시) 분리. LAW_STYLE 우선, 없으면 이름에서 추론.
// 결과 패널의 분야 밴드(sticky)에 '정보통신 › 시행령'처럼 현재 위치 하위법을 표기할 때 사용.
function lawParts(id){
  var st = LAW_STYLE[id] || {};
  if (st.family || st.sub) return { family: st.family || lawDisplay(id), sub: st.sub || '' };
  var name = lawDisplay(id);
  var m = name.match(/^(.*\S)\s+(시행령|시행규칙|시행세칙)$/);   // "○○법 시행령/시행규칙"
  if (m) return { family: m[1], sub: m[2] };
  return { family: name, sub: '' };
}
// 법령 색: LAW_STYLE → manifest.color → 순번 팔레트
function lawColor(id){
  if (LAW_STYLE[id] && LAW_STYLE[id].color) return LAW_STYLE[id].color;
  var mm = state.laws[id] && state.laws[id].manifestMeta;
  if (mm && mm.color) return mm.color;
  var i = state.order.indexOf(id);
  return FALLBACK_COLORS[(i < 0 ? 0 : i) % FALLBACK_COLORS.length];
}
// 법령 약칭(배지·태그용): LAW_STYLE → manifest.abbr → short → title
function lawAbbr(id){
  if (LAW_STYLE[id] && LAW_STYLE[id].abbr) return LAW_STYLE[id].abbr;
  var mm = state.laws[id] && state.laws[id].manifestMeta;
  return (mm && (mm.abbr || mm.short || mm.title)) || id;
}
// 분야(카테고리) 색: CATEGORY_STYLE → 그 분야 첫 법령 색
function categoryColor(cat, firstLawId){
  if (CATEGORY_STYLE[cat]) return CATEGORY_STYLE[cat];
  return firstLawId ? lawColor(firstLawId) : '#475569';
}
function lawSourceUrl(id){
  var L = state.laws[id]; if (!L) return '#';
  var mm = L.manifestMeta || {};
  var type = mm.type || (L.meta && L.meta.type) || '';
  var seg = (type === '행정규칙') ? '행정규칙' : '법령';   // 고시·훈령 등은 /행정규칙/, 법률·시행령은 /법령/
  var name = (mm.title || id).replace(/\s/g, '');
  var fallback = 'https://www.law.go.kr/' + seg + '/' + encodeURIComponent(name);
  if (L.meta && L.meta.source){ var safe = safeHttpUrl(L.meta.source); if (safe) return safe; }
  return fallback;   // source가 없거나 http(s)가 아니면 안전한 law.go.kr URL로 대체(법령 종류 반영)
}

/* =========================================================================
   데이터 로딩
   ========================================================================= */
function urlFor(path){ return CONFIG.DATA_BASE_URL + path; }

// 타임아웃이 있는 fetch — 무응답 시 abort해 .catch 경로로 보낸다(영구 '불러오는 중' 방지).
function fetchWithTimeout(url, opts){
  var ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
  var timer = ctrl ? setTimeout(function(){ try { ctrl.abort(); } catch(e){} }, CONFIG.FETCH_TIMEOUT_MS) : null;
  var o = ctrl ? Object.assign({}, opts, { signal: ctrl.signal }) : (opts || {});
  return fetch(url, o).then(function(r){ if (timer) clearTimeout(timer); return r; },
                           function(e){ if (timer) clearTimeout(timer); throw e; });
}

function lsGet(){ try { return JSON.parse(localStorage.getItem(CONFIG.LS_KEY) || '{}'); } catch(e){ return {}; } }
function lsSet(patch){
  try {
    var cur = lsGet(); for (var k in patch) cur[k] = patch[k];
    localStorage.setItem(CONFIG.LS_KEY, JSON.stringify(cur));
  } catch(e){ /* 저장 실패는 무시 (서드파티 iframe 등) */ }
}

function showBanner(msg){ var b=$('#lawapp-banner'); b.textContent=msg; b.classList.add('show'); }
function hideBanner(){ $('#lawapp-banner').classList.remove('show'); }

function init(){
  restoreUiState();
  applyResultsWidth();
  renderColumns();
  renderLawBadges();
  bindTopbar();
  bindMode();
  bindResizer();
  var reopen = $('#lawapp-results-reopen');
  if (reopen) reopen.addEventListener('click', function(){ toggleResults(false); });
  loadManifest();
}

function loadManifest(){
  var loadEl = $('#lawapp-loading'); loadEl.classList.add('show');
  fetchWithTimeout(urlFor('manifest.json'), { cache:'no-cache' })
    .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.text(); })
    .then(function(txt){
      var data;
      try { data = JSON.parse(txt); }
      catch(e){ throw new Error('manifest-parse'); }
      if (!data || !Array.isArray(data.laws)) throw new Error('manifest-shape');
      applyManifest(data);   // 정제된 결과를 applyManifest 내부에서 캐시에 저장
    })
    .catch(function(err){
      var cached = lsGet().manifest;
      if (cached && Array.isArray(cached.laws)){
        showBanner('법령 목록을 새로 불러오지 못해 마지막 정상 목록으로 표시합니다. (' + err.message + ')');
        applyManifest(cached);
      } else {
        loadEl.classList.remove('show');
        showBanner('법령 목록(manifest.json)을 불러오지 못했습니다. 잠시 후 새로고침 해주세요. (' + err.message + ')');
      }
    });
}

function applyManifest(data){
  // 항목 형태 검증: id/file이 문자열로 존재해야 하고 id 중복은 첫 항목만 채택 (단일 장애점 방어선)
  var seen = {}, dropped = 0;
  var laws = (data.laws || []).filter(function(m){
    if (!m || typeof m.id !== 'string' || !m.id || typeof m.file !== 'string' || !m.file){ dropped++; return false; }
    if (seen[m.id]){ dropped++; return false; }
    seen[m.id] = true; return true;
  });
  var clean = { laws: laws };
  state.manifest = clean;
  lsSet({ manifest: clean });   // 오염되지 않은 항목만 캐시에 저장
  if (dropped > 0) showBanner('법령 목록 중 형식이 잘못된 항목 ' + dropped + '개를 제외하고 표시합니다.');

  var sorted = laws.slice().sort(function(a,b){ return (a.order||0)-(b.order||0); });
  state.order = [];
  state.laws = {};
  sorted.forEach(function(m){
    state.order.push(m.id);
    state.laws[m.id] = { manifestMeta:m, meta:{}, rows:[], toc:[], loaded:false, error:null };
  });
  applyPendingColumns();
  renderColumns();
  renderLawBadges();
  loadAllLaws();
}

function loadAllLaws(){
  var total = state.order.length, done = 0;
  updateLoadProgress(done, total);
  state.order.forEach(function(id){
    var L = state.laws[id];
    // 캐시 무효화는 ?v=version 쿼리로만(설계 5.5). cache:'default'라야 동일 버전 재방문 시 브라우저 캐시 활용.
    fetchWithTimeout(urlFor(L.manifestMeta.file) + '?v=' + encodeURIComponent(L.manifestMeta.version||''), { cache:'default' })
      .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.text(); })
      .then(function(md){
        var parsed = parseLaw(md, id);
        L.meta = parsed.meta; L.rows = parsed.rows; L.toc = parsed.toc; L.loaded = true; L.error = null;
      })
      .catch(function(err){ L.error = (err && err.name === 'AbortError') ? '응답 시간 초과' : (err.message || '로드 실패'); })
      .then(function(){
        done++; updateLoadProgress(done, total);
        // 이 법령이 열려 있는 열을 갱신 + 저장된 스크롤 위치 복원
        state.columns.forEach(function(col, ci){
          if (col.lawId === id){ renderColumnBody(ci); restorePendingCenter(ci); }
        });
        if (state.rawQuery) runSearch();
        if (done === total){ $('#lawapp-loading').classList.remove('show'); }
      });
  });
}

function updateLoadProgress(done, total){
  $('#lawapp-load-count').textContent = done+'/'+total;
  $('#lawapp-load-fill').style.width = total ? Math.round(done/total*100)+'%' : '0%';
}

/* =========================================================================
   상단 바 / 열 수 컨트롤
   ========================================================================= */
function bindTopbar(){
  var input = $('#lawapp-search'), wrap = $('#lawapp-searchwrap'), clear = $('#lawapp-search-clear');
  var timer = null;
  input.addEventListener('input', function(){
    wrap.classList.toggle('has-text', input.value.length>0);
    if (timer) clearTimeout(timer);
    timer = setTimeout(function(){ setQuery(input.value); }, CONFIG.DEBOUNCE_MS);
  });
  clear.addEventListener('click', function(){ input.value=''; wrap.classList.remove('has-text'); input.focus(); setQuery(''); });
}

/* 검색 모드 세그먼트 (설명은 버튼 title 툴팁으로) */
function setSearchMode(mode){
  if (mode !== 'exact' && mode !== 'loose' && mode !== 'phrase') return;
  state.searchMode = mode;
  Array.prototype.forEach.call(document.querySelectorAll('#lawapp-segment button'), function(b){
    var on = b.getAttribute('data-mode') === mode;
    b.classList.toggle('active', on);
    if (on) b.setAttribute('aria-selected','true'); else b.removeAttribute('aria-selected');
  });
  if (state.rawQuery) runSearch();   // 모드 바뀌면 현재 검색을 다시 평가
}
function bindMode(){
  Array.prototype.forEach.call(document.querySelectorAll('#lawapp-segment button'), function(b){
    b.addEventListener('click', function(){ setSearchMode(b.getAttribute('data-mode')); });
  });
}

function newColumn(lawId){ return { lawId: lawId || null, curMatch:-1, matchPos:[], rowRanges:{}, useTick: ++state.useTick }; }

function findColumnWithLaw(lawId){
  for (var i=0; i<state.columns.length; i++) if (state.columns[i].lawId === lawId) return i;
  return -1;
}

// 법령을 열로 연다(이미 열려 있으면 그 열 반환). 가득(4)이면 가장 오래 안 쓴 열을 교체. 열 인덱스 반환.
function openLaw(lawId){
  if (!lawId || !state.laws[lawId]) return -1;
  var ci = findColumnWithLaw(lawId);
  if (ci !== -1){ touchColumn(ci); return ci; }
  if (state.columns.length < MAX_COLUMNS){
    state.columns.push(newColumn(lawId));
    renderColumns(); renderLawBadges(); saveUiState();
    return state.columns.length - 1;
  }
  var lru = 0, min = Infinity;
  for (var j=0; j<state.columns.length; j++){ if (state.columns[j].useTick < min){ min = state.columns[j].useTick; lru = j; } }
  state.columns[lru] = newColumn(lawId);
  renderColumns(); renderLawBadges(); saveUiState();
  return lru;
}

// 배지 토글: 열려 있으면 닫고, 아니면 연다.
function toggleLawColumn(lawId){
  var ci = findColumnWithLaw(lawId);
  if (ci !== -1) closeColumn(ci);
  else openLaw(lawId);
}

function closeColumn(ci){
  if (ci < 0 || ci >= state.columns.length) return;
  state.columns.splice(ci, 1);
  renderColumns(); renderLawBadges(); saveUiState();
}

/* =========================================================================
   열 렌더링
   ========================================================================= */
function renderColumns(){
  var cont = $('#lawapp-columns');
  recordColumnViews();   // 재렌더로 DOM이 사라지기 전, 각 열의 현재 스크롤 위치를 법령별로 보존
  cont.setAttribute('data-count', state.columns.length);
  cont.innerHTML = '';
  if (!state.columns.length){
    var empty = el('div','lawapp-empty-all');
    empty.innerHTML = '상단의 <b>법령별 배지</b>를 켜거나, 검색 결과를 클릭하면 법령이 이곳에 열립니다.';
    cont.appendChild(empty);
    return;
  }
  state.columns.forEach(function(col, ci){
    cont.appendChild(buildColumnEl(col, ci));
    renderColumnBody(ci);
    // 검색 활성 시: 새로 그린 본문에 매칭·하이라이트 재적용 (열 추가/닫기 후에도 강조 유지)
    if (state.query.phraseNorm) computeColumnMatches(ci);
    refreshColumnMatchNav(ci);
    if (state.query.phraseNorm) applyColumnHighlights(ci);
    restoreColumnView(ci);   // 보존해둔 스크롤 위치·타깃 강조 복원 (배지 토글 시 위치 유지)
  });
}

// 뷰포트 상단에 걸친 기준 행(anchor)과 그 오프셋을 구함. 픽셀 scrollTop이 아니라 '행 기준'이라
// 다른 열을 닫아 이 열이 넓어지며 본문이 리플로우(줄바꿈 변화)돼도 같은 내용이 보이게 복원할 수 있음.
function anchorRowOf(body){
  var rows = body.querySelectorAll('.lawapp-row');
  if (!rows.length) return null;
  var bTop = body.getBoundingClientRect().top;
  var anchor = rows[0];
  for (var i=0; i<rows.length; i++){
    if (rows[i].getBoundingClientRect().top - bTop <= 6) anchor = rows[i];   // 기준선(상단+6px) 위로 지나간 마지막 행
    else break;
  }
  var line = anchor.getAttribute('data-line');
  return line == null ? null : { line: +line, offset: anchor.getBoundingClientRect().top - bTop };
}

// 재렌더 직전: 각 열의 현재 위치를 '기준 행+오프셋'으로 법령별 메모리에 저장(인덱스 아닌 data-law 기준 — 닫는 열도 보존).
function recordColumnViews(){
  var cont = $('#lawapp-columns');
  if (!cont) return;
  Array.prototype.forEach.call(cont.querySelectorAll('.lawapp-col[data-law]'), function(colEl){
    var lawId = colEl.getAttribute('data-law');
    var body = colEl.querySelector('.lawapp-col-body');
    if (!body) return;
    var v = state.lawView[lawId] || (state.lawView[lawId] = {});
    var a = anchorRowOf(body);
    if (a){ v.anchorLine = a.line; v.anchorOffset = a.offset; }
    v.scrollTop = body.scrollTop;   // 폴백(행 정보가 없을 때)
  });
}

// 재렌더 후: 같은 법령이면 기준 행을 같은 오프셋으로 되돌려(너비 변화 리플로우에도 동일 내용 유지), 강조 타깃 행을 다시 표시.
function restoreColumnView(ci){
  var col = state.columns[ci];
  if (!col || !col.lawId) return;
  var v = state.lawView[col.lawId];
  if (!v) return;
  // 타깃 행이 매칭이면 curMatch도 그 위치로 맞춰 ◀▶·.cur 강조 정합
  if (v.line != null && col.matchPos && col.matchPos.length){
    for (var k=0; k<col.matchPos.length; k++){ if (col.matchPos[k].idx === v.line){ col.curMatch = k; break; } }
    refreshColumnMatchNav(ci);
    applyColumnHighlights(ci);
  }
  var body = document.querySelector('.lawapp-col-body[data-col="'+ci+'"]');
  if (!body) return;
  if (v.line != null){
    var rowEl = body.querySelector('.lawapp-row[data-line="'+v.line+'"]');
    if (rowEl) rowEl.classList.add('lawapp-target');
  }
  requestAnimationFrame(function(){
    if (!body.isConnected) return;
    if (v.anchorLine != null){
      var a = body.querySelector('.lawapp-row[data-line="'+v.anchorLine+'"]');
      if (a){ body.scrollTop += (a.getBoundingClientRect().top - body.getBoundingClientRect().top) - (v.anchorOffset || 0); return; }
    }
    if (v.scrollTop != null) body.scrollTop = v.scrollTop;   // 폴백
  });
}

function buildColumnEl(col, ci){

function touchColumn(ci){ if (state.columns[ci]) state.columns[ci].useTick = ++state.useTick; }

function renderColumnBody(ci){
  var body = document.querySelector('.lawapp-col-body[data-col="'+ci+'"]');
  if (!body) return;
  var col = state.columns[ci];
  if (!col.lawId){ body.innerHTML=''; var em=el('div','lawapp-col-empty'); em.innerHTML='상단의 법령별 배지를 켜거나,<br>검색 결과를 클릭하면 이 열에 열립니다.'; body.appendChild(em); return; }
  var L = state.laws[col.lawId];
  if (!L){ body.innerHTML=''; return; }
  if (L.error){
    body.innerHTML='';
    var er=el('div','lawapp-col-error');
    er.innerHTML='“'+escapeHtml(lawDisplay(col.lawId))+'” 불러오기 실패<br>('+escapeHtml(L.error)+')<br>';
    var rb=el('button'); rb.textContent='재시도';
    rb.addEventListener('click', function(){ retryLaw(col.lawId); });
    er.appendChild(rb); body.appendChild(er); return;
  }
  if (!L.loaded){ body.innerHTML='<div class="lawapp-col-loading">법령을 불러오는 중…</div>'; return; }

  var html = '';
  for (var i=0; i<L.rows.length; i++){
    var r = L.rows[i];
    var indCls = (r.kind === 'body' && r.indent) ? (' lawapp-ind'+r.indent) : '';   // 항·호·목 내어쓰기
    html += '<div class="lawapp-row lawapp-'+r.kind+indCls+'" data-line="'+r.idx+'"'+(r.isHeading?(' data-art="'+escapeHtml(r.artNo||r.text)+'"'):'')+'>'+escapeHtml(r.text)+'</div>';
  }
  body.innerHTML = html;
}

function retryLaw(id){
  var L = state.laws[id];
  L.error = null;
  state.columns.forEach(function(col,ci){ if(col.lawId===id) renderColumnBody(ci); });
  fetchWithTimeout(urlFor(L.manifestMeta.file) + '?v=' + encodeURIComponent(L.manifestMeta.version||'') + '&r=1', { cache:'default' })
    .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.text(); })
    .then(function(md){ var p=parseLaw(md,id); L.meta=p.meta; L.rows=p.rows; L.toc=p.toc; L.loaded=true; L.error=null; })
    .catch(function(err){ L.error = (err && err.name === 'AbortError') ? '응답 시간 초과' : (err.message || '로드 실패'); })
    .then(function(){
      state.columns.forEach(function(col,ci){ if(col.lawId===id){ renderColumnBody(ci); computeColumnMatches(ci); refreshColumnMatchNav(ci); applyColumnHighlights(ci); } });
      if (state.rawQuery) runSearch();
    });
}

/* =========================================================================
   검색
   ========================================================================= */
function setQuery(raw){
  state.rawQuery = raw;
  state.query = buildQuery(raw);
  state.resultLimit = {};
  runSearch();
}

function runSearch(){
  var resEl = $('#lawapp-results');
  if (!state.query.phraseNorm){
    state.resultTotals = {};
    resEl.innerHTML='';
    state.columns.forEach(function(col,ci){ col.matchPos=[]; col.rowRanges={}; col.curMatch=-1; refreshColumnMatchNav(ci); applyColumnHighlights(ci); });
    updateResultsVisibility();
    renderLawBadges();   // 검색 해제 → 배지 카운트 제거
    return;
  }
  // 1) 전체 법령 결과 패널 (computeResults가 state.resultTotals를 채움)
  renderResults();
  // 2) 열별 매칭 갱신 + 하이라이트
  state.columns.forEach(function(col,ci){ computeColumnMatches(ci); refreshColumnMatchNav(ci); applyColumnHighlights(ci); });
  // 3) 결과 패널 표시 여부 + 배지 카운트
  updateResultsVisibility();
  renderLawBadges();
}

// 좌측 결과 패널 표시 토글 (패널 + 리사이저 + 재열기 탭)
function updateResultsVisibility(){
  var resEl = $('#lawapp-results'), reopen = $('#lawapp-results-reopen'), rz = $('#lawapp-results-resizer');
  var searching = !!state.query.phraseNorm;
  var showPanel = searching && !state.resultsHidden;
  resEl.classList.toggle('show', showPanel);
  if (rz) rz.classList.toggle('show', showPanel);
  if (reopen) reopen.classList.toggle('show', searching && state.resultsHidden);
}
function toggleResults(hide){
  state.resultsHidden = (hide == null) ? !state.resultsHidden : !!hide;
  updateResultsVisibility();
  saveUiState();
}
// 결과 패널 너비(드래그 조절)
function applyResultsWidth(){
  var root = document.getElementById('lawapp-root');
  if (root) root.style.setProperty('--results-w', state.resultsWidth + 'px');
}
function bindResizer(){
  var rz = $('#lawapp-results-resizer');
  if (!rz) return;
  var startX = 0, startW = 0, dragging = false;
  rz.addEventListener('pointerdown', function(e){
    dragging = true; startX = e.clientX; startW = state.resultsWidth;
    rz.classList.add('dragging');
    try { rz.setPointerCapture(e.pointerId); } catch(_){}
    e.preventDefault();
  });
  rz.addEventListener('pointermove', function(e){
    if (!dragging) return;
    state.resultsWidth = Math.max(200, Math.min(640, Math.round(startW + (e.clientX - startX))));
    applyResultsWidth();
  });
  function end(e){
    if (!dragging) return;
    dragging = false; rz.classList.remove('dragging');
    try { rz.releasePointerCapture(e.pointerId); } catch(_){}
    saveUiState();
  }
  rz.addEventListener('pointerup', end);
  rz.addEventListener('pointercancel', end);
}

// 결과: [{ lawId, total, arts:[{key,label, rows:[{row, ranges}] }] }]
function computeResults(){
  var q = state.query, groups = [];
  state.resultTotals = {};
  state.order.forEach(function(id){
    var L = state.laws[id];
    if (!L || !L.loaded) return;
    var arts = [], byKey = {}, total = 0;
    for (var i=0; i<L.rows.length; i++){
      var r = L.rows[i];
      var m = matchRow(r, q, state.searchMode);
      if (!m.match) continue;
      total += m.ranges.length;   // 매칭 위치(occurrence) 단위 건수 (명세 5.2)
      if (!byKey[r.groupKey]){ byKey[r.groupKey] = { key:r.groupKey, label:r.groupLabel||'(머리말)', rows:[] }; arts.push(byKey[r.groupKey]); }
      byKey[r.groupKey].rows.push({ row:r, ranges:m.ranges, type:m.type });
    }
    if (total>0){
      // 명세 5.2: 구문 일치를 AND 일치보다 상위에 노출 (그룹·행 모두 안정 정렬, 문서순 보존)
      arts.forEach(function(a){
        a.hasPhrase = a.rows.some(function(x){ return x.type === 'phrase'; });
        a.rows.sort(function(x,y){ return (x.type==='phrase'?0:1) - (y.type==='phrase'?0:1); });
      });
      arts.sort(function(a,b){ return (b.hasPhrase?1:0) - (a.hasPhrase?1:0); });
      state.resultTotals[id] = total;
      groups.push({ lawId:id, total:total, arts:arts });
    }
  });
  return groups;
}

function renderResults(){
  var resEl = $('#lawapp-results');
  var groups = computeResults();
  var grand = groups.reduce(function(s,g){ return s+g.total; }, 0);
  // 스크롤 위치 보존(재렌더 시)
  var oldScroll = resEl.querySelector('.lawapp-results-scroll');
  var prevScroll = oldScroll ? oldScroll.scrollTop : 0;

  resEl.innerHTML = '';

  var head = el('div','lawapp-results-head');
  var ht = el('span','lawapp-rh-ttl'); ht.textContent = '검색 결과';
  var hm = el('span','lawapp-rh-meta'); hm.textContent = grand ? (groups.length+'개 법령 · '+grand+'건') : '0건';
  var cb = el('button','lawapp-results-collapse'); cb.id = 'lawapp-results-collapse'; cb.innerHTML = '‹'; cb.title = '검색 결과 접기'; cb.setAttribute('aria-label','검색 결과 접기');
  cb.addEventListener('click', function(){ toggleResults(true); });
  head.appendChild(ht); head.appendChild(hm); head.appendChild(cb);
  resEl.appendChild(head);

  var jump = el('div','lawapp-results-jump');   // 법령별 바로가기 칩
  resEl.appendChild(jump);

  var scroll = el('div','lawapp-results-scroll');
  resEl.appendChild(scroll);

  if (!grand){
    jump.style.display = 'none';
    var nr = el('div','lawapp-noresult'); nr.innerHTML = '검색 결과 없음<br>— 검색 모드를 바꾸거나 키워드를 줄여보세요';
    scroll.appendChild(nr);
    return;
  }

  var jumpItems = [];   // {lawId, total, headEl}

  // 분야(카테고리)별 묶기 — manifest order 보존
  var cats = [], byCat = {};
  groups.forEach(function(g){
    var cat = (state.laws[g.lawId].manifestMeta || {}).category || '기타';
    if (!byCat[cat]){ byCat[cat] = []; cats.push(cat); }
    byCat[cat].push(g);
  });

  cats.forEach(function(cat){
    var cgroups = byCat[cat];
    var catTotal = cgroups.reduce(function(s,g){ return s+g.total; }, 0);
    var field = el('div','lawapp-field');
    var fh = el('div','lawapp-field-head'); fh.style.setProperty('--fc', categoryColor(cat, cgroups[0].lawId));
    var fbar = el('span','lawapp-fbar');
    var fnm = el('span','lawapp-fnm'); fnm.textContent = cat;
    var fcur = el('span','lawapp-fcur');   // 스크롤 위치의 하위법(시행령 등) — updateFieldCrumbs가 채움
    var fct = el('span','lawapp-fct'); fct.textContent = cgroups.length+'개 법령 · '+catTotal+'건';
    fh.appendChild(fbar); fh.appendChild(fnm); fh.appendChild(fcur); fh.appendChild(fct);
    field.appendChild(fh);

    cgroups.forEach(function(g){
      var lg = el('div','lawapp-lawgroup'); lg.style.setProperty('--lawc', lawColor(g.lawId));
      var mm = state.laws[g.lawId].manifestMeta || {};
      var lh = el('div','lawapp-law-head');
      var ldot = el('span','lawapp-ldot');
      var lname = el('span','lawapp-lname'); lname.textContent = lawDisplay(g.lawId);
      lh.appendChild(ldot); lh.appendChild(lname);
      if (mm.type){ var labbr = el('span','lawapp-labbr'); labbr.textContent = mm.type; lh.appendChild(labbr); }
      var lcount = el('span','lawapp-lcount'); lcount.textContent = g.total+'건'; lh.appendChild(lcount);
      lg.appendChild(lh);
      lh.setAttribute('data-lawjump', g.lawId);
      jumpItems.push({ lawId:g.lawId, total:g.total, headEl:lh });

      // 조문 1개 = 항목 1개 (대표 매칭 행으로 발췌). RESULTS_PER_LAW로 제한 + 더보기.
      var limit = state.resultLimit[g.lawId] || CONFIG.RESULTS_PER_LAW;
      var shownArts = g.arts.slice(0, limit);
      var selLine = state.lawView[g.lawId] && state.lawView[g.lawId].line;   // 이 법령에서 선택된 결과(법령별 1개)
      shownArts.forEach(function(a){
        var it0 = a.rows[0];
        var it = el('button','lawapp-item');
        if (selLine != null && it0.row.idx === selLine) it.classList.add('selected');
        it.setAttribute('data-law', g.lawId); it.setAttribute('data-line', it0.row.idx);
        var jo = el('div','lawapp-item-jo'); jo.textContent = a.label;
        var ex = el('div','lawapp-item-ex'); ex.innerHTML = excerptHtml(it0.row.text, it0.ranges);
        it.appendChild(jo); it.appendChild(ex);
        it.addEventListener('click', function(){ openResult(g.lawId, it0.row.idx); });
        lg.appendChild(it);
      });
      if (g.arts.length > shownArts.length){
        var more = el('button','lawapp-rmore');
        more.textContent = '+ '+(g.arts.length - shownArts.length)+'개 조문 더보기';
        more.addEventListener('click', function(){ state.resultLimit[g.lawId] = (state.resultLimit[g.lawId]||CONFIG.RESULTS_PER_LAW)+CONFIG.RESULTS_PER_LAW; renderResults(); });
        lg.appendChild(more);
      }
      field.appendChild(lg);
    });
    scroll.appendChild(field);
  });

  // 법령별 바로가기 칩 채우기 (법령이 2개 이상일 때만 노출)
  if (jumpItems.length > 1){
    jumpItems.forEach(function(it){
      var chip = el('button','lawapp-jump-chip');
      chip.setAttribute('data-jump', it.lawId);
      chip.style.setProperty('--lawc', lawColor(it.lawId));
      chip.title = lawDisplay(it.lawId) + '로 이동';
      var d = el('span','lawapp-jump-dot');
      var n = el('span','lawapp-jump-nm'); n.textContent = lawDisplay(it.lawId);
      var c = el('span','lawapp-jump-cnt'); c.textContent = it.total;
      chip.appendChild(d); chip.appendChild(n); chip.appendChild(c);
      chip.addEventListener('click', function(){
        var r1 = it.headEl.getBoundingClientRect(), r0 = scroll.getBoundingClientRect();
        scroll.scrollTop += (r1.top - r0.top) - 30;   // 분야 sticky 밴드 아래로
      });
      jump.appendChild(chip);
    });
  } else {
    jump.style.display = 'none';
  }

  scroll.scrollTop = prevScroll;
  // 분야 sticky 밴드에 '정보통신 › 시행령'처럼 현재 스크롤 위치의 하위법을 표기(스크롤 추적)
  scroll.addEventListener('scroll', function(){
    if (_crumbRaf) return;
    _crumbRaf = requestAnimationFrame(function(){ _crumbRaf = 0; updateFieldCrumbs(scroll); });
  }, { passive:true });
  updateFieldCrumbs(scroll);
}

var _crumbRaf = 0;
// 각 분야 밴드(sticky)에 그 밴드 바로 아래에 걸린 현재 법령의 하위표기(시행령 등)를 채움. 본법 구간은 비움.
function updateFieldCrumbs(scroll){
  if (!scroll) scroll = document.querySelector('.lawapp-results-scroll');
  if (!scroll) return;
  var cTop = scroll.getBoundingClientRect().top;
  var fields = scroll.querySelectorAll('.lawapp-field');
  Array.prototype.forEach.call(fields, function(field){
    var fh = field.querySelector('.lawapp-field-head');
    var fcur = field.querySelector('.lawapp-fcur');
    if (!fh || !fcur) return;
    var refY = cTop + fh.offsetHeight + 4;        // sticky 밴드 바로 아래 기준선
    var heads = field.querySelectorAll('.lawapp-law-head[data-lawjump]');
    var curId = null;
    for (var i=0; i<heads.length; i++){
      if (heads[i].getBoundingClientRect().top <= refY) curId = heads[i].getAttribute('data-lawjump');
      else break;
    }
    var sub = curId ? lawParts(curId).sub : '';   // 본법(또는 밴드 최상단)은 sub 없음 → 분야명만
    fcur.textContent = sub || '';                 // '›' 구분자는 CSS ::before로(간격 확보)
  });
}

// 결과 미리보기: 첫 매칭 주변을 잘라 하이라이트
function excerptHtml(text, ranges){
  ranges = mergeRanges(ranges||[]);
  var maxLen = 80;
  if (text.length <= maxLen || !ranges.length) return buildHighlightHtml(text, ranges);
  var first = ranges[0][0];
  var start = Math.max(0, first - 24);
  var end = Math.min(text.length, start + maxLen);
  var slice = text.slice(start, end);
  var adj = ranges.map(function(r){ return [r[0]-start, r[1]-start]; }).filter(function(r){ return r[1]>0 && r[0]<slice.length; })
                  .map(function(r){ return [Math.max(0,r[0]), Math.min(slice.length, r[1])]; });
  return (start>0?'… ':'') + buildHighlightHtml(slice, adj) + (end<text.length?' …':'');
}

/* =========================================================================
   법령별 토글 배지 (열 = 켜진 배지) + 상단 메타
   ========================================================================= */
function renderLawBadges(){
  var wrap = $('#lawapp-lawbadges');

  state.order.forEach(function(id){

    b.setAttribute('data-tip', lawDisplay(id) + (open ? '  (켜짐 · 클릭하면 닫기)' : '  (클릭하면 열기)'));
    b.setAttribute('aria-label', (open ? '열 닫기: ' : '열 열기: ') + lawDisplay(id));

/* =========================================================================
   열 내 매칭 / 이동 / 하이라이트
   ========================================================================= */
// 열 내 매칭을 'occurrence(매칭 위치)' 단위로 계산 (명세 5.2: 건수·하이라이트·◀▶ 통일).
// col.matchPos: [{idx, range}] 문서 순서. col.rowRanges: idx→ranges (하이라이트 재사용으로 matchRow 중복 호출 제거).
function computeColumnMatches(ci){
  var col = state.columns[ci];
  col.matchPos = []; col.rowRanges = {};
  if (!col.lawId || !state.query.phraseNorm){ col.curMatch = -1; return; }
  var L = state.laws[col.lawId];
  if (!L || !L.loaded){ col.curMatch = -1; return; }
  for (var i=0; i<L.rows.length; i++){
    var m = matchRow(L.rows[i], state.query, state.searchMode);
    if (!m.match) continue;
    var idx = L.rows[i].idx;
    col.rowRanges[idx] = m.ranges;
    for (var r=0; r<m.ranges.length; r++) col.matchPos.push({ idx: idx, range: m.ranges[r] });
  }
  if (col.matchPos.length){ if (col.curMatch < 0 || col.curMatch >= col.matchPos.length) col.curMatch = 0; }
  else col.curMatch = -1;
}

function refreshColumnMatchNav(ci){
  var nav = document.querySelector('.lawapp-matchnav[data-col="'+ci+'"]');
  if (!nav) return;
  var col = state.columns[ci];
  var total = (col.matchPos && col.matchPos.length) || 0;
  var has = state.query.phraseNorm && total > 0;
  nav.classList.toggle('show', !!(state.query.phraseNorm && col.lawId));
  var cnt = nav.querySelector('.lawapp-matchcount');
  var prev = nav.querySelector('.lawapp-match-prev');
  var next = nav.querySelector('.lawapp-match-next');
  if (has){ cnt.textContent = (col.curMatch+1)+'/'+total; prev.disabled=false; next.disabled=false; }
  else { cnt.textContent='0/0'; prev.disabled=true; next.disabled=true; }
}

function moveMatch(ci, dir){
  var col = state.columns[ci];
  if (!col.matchPos || !col.matchPos.length) return;
  col.curMatch = (col.curMatch + dir + col.matchPos.length) % col.matchPos.length;
  touchColumn(ci);
  refreshColumnMatchNav(ci);
  applyColumnHighlights(ci);
  scrollRowToCenter(ci, col.matchPos[col.curMatch].idx, true);
}

// 매칭 행에만 하이라이트 적용, 그 외 행은 원본 텍스트로 복원. 현재 occurrence만 .cur 강조.
function applyColumnHighlights(ci){
  var body = document.querySelector('.lawapp-col-body[data-col="'+ci+'"]');
  if (!body) return;
  var col = state.columns[ci];
  Array.prototype.forEach.call(body.querySelectorAll('.lawapp-row.lawapp-hled'), function(rowEl){
    var idx = +rowEl.getAttribute('data-line');
    var L0 = state.laws[col.lawId];
    if (L0 && L0.rows[idx]) rowEl.innerHTML = escapeHtml(L0.rows[idx].text);
    rowEl.classList.remove('lawapp-hled');
  });
  if (!col.lawId || !state.query.phraseNorm || !col.rowRanges) return;
  var L = state.laws[col.lawId];
  if (!L || !L.loaded) return;
  var cur = (col.curMatch >= 0 && col.matchPos[col.curMatch]) ? col.matchPos[col.curMatch] : null;
  Object.keys(col.rowRanges).forEach(function(key){
    var idx = +key;
    var rowEl = body.querySelector('.lawapp-row[data-line="'+idx+'"]');
    if (!rowEl) return;
    var curRange = (cur && cur.idx === idx) ? cur.range : null;
    rowEl.innerHTML = buildHighlightHtml(L.rows[idx].text, col.rowRanges[idx], curRange);
    rowEl.classList.add('lawapp-hled');
  });
}

// 현재 열에서 뷰포트 세로 중앙에 가장 가까운 행의 data-line (상태 저장용)
function currentCenterRowIdx(ci){
  var body = document.querySelector('.lawapp-col-body[data-col="'+ci+'"]');
  if (!body) return null;
  var rows = body.querySelectorAll('.lawapp-row');
  if (!rows.length) return null;
  var cRect = body.getBoundingClientRect();
  var mid = cRect.top + cRect.height/2;
  var best = null, bestDist = Infinity;
  for (var i=0; i<rows.length; i++){
    var rRect = rows[i].getBoundingClientRect();
    if (rRect.bottom < cRect.top || rRect.top > cRect.bottom) continue;   // 보이는 행만
    var d = Math.abs((rRect.top + rRect.height/2) - mid);
    if (d < bestDist){ bestDist = d; best = +rows[i].getAttribute('data-line'); }
  }
  return best;
}

// 저장된 중앙 행으로 1회 복원 (법령 로드·렌더 완료 후 호출)
function restorePendingCenter(ci){
  if (!state._pendingCenters) return;
  var idx = state._pendingCenters[ci];
  if (idx == null) return;
  state._pendingCenters[ci] = null;
  requestAnimationFrame(function(){ scrollRowToCenter(ci, idx, false); });
}

function scrollRowToCenter(ci, lineIdx, pulse){
  var body = document.querySelector('.lawapp-col-body[data-col="'+ci+'"]');
  if (!body) return;
  var rowEl = body.querySelector('.lawapp-row[data-line="'+lineIdx+'"]');
  if (!rowEl) return;
  var cRect = body.getBoundingClientRect();
  var rRect = rowEl.getBoundingClientRect();
  var delta = (rRect.top - cRect.top) - (body.clientHeight/2 - rRect.height/2);
  body.scrollTop += delta;
  if (pulse){
    Array.prototype.forEach.call(body.querySelectorAll('.lawapp-target'), function(e){ e.classList.remove('lawapp-target'); });
    void rowEl.offsetWidth;
    rowEl.classList.add('lawapp-target');
    // 이 행을 법령별 '현재 위치'로 기억 → 배지 토글로 닫았다 열어도 같은 위치·강조 복원
    var col = state.columns[ci];
    if (col && col.lawId){
      var v = state.lawView[col.lawId] || (state.lawView[col.lawId] = {}); v.line = lineIdx; v.scrollTop = body.scrollTop;
      syncResultSelection();   // 좌측 결과 패널에서 이 법령의 선택 항목 갱신(법령별 1개씩)
    }
  }
}

// 좌측 결과 패널의 선택 표시를 lawView(법령별 현재 위치)에 맞춰 갱신. 법령마다 1개씩 독립 유지.
function syncResultSelection(){
  var items = document.querySelectorAll('#lawapp-results .lawapp-item');
  Array.prototype.forEach.call(items, function(it){
    var lawId = it.getAttribute('data-law');
    var v = state.lawView[lawId];
    it.classList.toggle('selected', !!(v && v.line === +it.getAttribute('data-line')));
  });
}

/* =========================================================================
   결과 클릭 → 열 열기/이동 (5.3)
   ========================================================================= */
function openResult(lawId, lineIdx){
  var ci = openLaw(lawId);   // 이미 열려 있으면 그 열, 아니면 새 열(또는 4개 가득 시 LRU 교체)
  if (ci < 0) return;
  var col = state.columns[ci];
  computeColumnMatches(ci);
  // curMatch를 클릭한 행의 첫 매칭 위치로
  var pos = -1;
  if (col.matchPos){ for (var k=0; k<col.matchPos.length; k++){ if (col.matchPos[k].idx === lineIdx){ pos = k; break; } } }
  if (pos >= 0) col.curMatch = pos;
  touchColumn(ci);
  refreshColumnMatchNav(ci);
  applyColumnHighlights(ci);
  // 렌더 직후 레이아웃 안정화를 위해 다음 프레임에 스크롤
  requestAnimationFrame(function(){ scrollRowToCenter(ci, lineIdx, true); });
  if (isMobile()) $('#lawapp-results').classList.remove('show');
}

/* =========================================================================
   목차
   ========================================================================= */
function toggleToc(ci, show){
  var toc = document.querySelector('.lawapp-toc[data-col="'+ci+'"]');
  if (!toc) return;
  var col = state.columns[ci];
  if (show && col.lawId && state.laws[col.lawId] && state.laws[col.lawId].loaded){
    var L = state.laws[col.lawId];
    toc.innerHTML='';
    var th = el('div','lawapp-toc-head'); th.textContent = lawDisplay(col.lawId)+' 목차';
    var cl = el('button','lawapp-toc-close'); cl.innerHTML='&times;';
    cl.addEventListener('click', function(){ toc.classList.remove('show'); });
    th.appendChild(cl); toc.appendChild(th);
    var tb = el('div','lawapp-toc-body');
    L.toc.forEach(function(t){
      var it = el('button','lawapp-toc-item lvl'+t.level); it.textContent = t.text;
      it.addEventListener('click', function(){ toc.classList.remove('show'); touchColumn(ci); requestAnimationFrame(function(){ scrollRowToCenter(ci, t.idx, true); }); });
      tb.appendChild(it);
    });
    toc.appendChild(tb);
    toc.classList.add('show');
  } else {
    toc.classList.remove('show');
  }
}

/* =========================================================================
   UI 상태 저장/복원 (5.4)
   ========================================================================= */
function isMobile(){ return window.matchMedia('(max-width:768px)').matches; }

var _saveTimer = null;
function scheduleSaveUiState(){ if (_saveTimer) clearTimeout(_saveTimer); _saveTimer = setTimeout(saveUiState, 400); }

function saveUiState(){
  if (isMobile()) return;   // 모바일 변형이 저장된 데스크톱 구성을 덮어쓰지 않도록 보류
  lsSet({ ui: {
    columns: state.columns.map(function(c){ return c.lawId; }),
    centers: state.columns.map(function(c, ci){ return currentCenterRowIdx(ci); }),  // 스크롤 위치(중앙 행)
    resultsHidden: state.resultsHidden,
    resultsWidth: state.resultsWidth
  } });
}
function restoreUiState(){
  var ui = lsGet().ui;
  // 실제 열 생성·스크롤 복원은 manifest 로드 후(applyPendingColumns).
  state._pendingCols = ui && Array.isArray(ui.columns) ? ui.columns.slice() : null;
  state._pendingCenters = ui && Array.isArray(ui.centers) ? ui.centers : null;
  state.resultsHidden = !!(ui && ui.resultsHidden);
  if (ui && typeof ui.resultsWidth === 'number') state.resultsWidth = Math.max(200, Math.min(640, ui.resultsWidth));
}
// manifest 로드 후: 저장된 열 배정을 복원하거나, 첫 방문이면 기본 법령을 자동으로 연다.
function applyPendingColumns(){
  if (state._pendingCols){
    var ids = state._pendingCols.filter(function(id){ return id && state.laws[id]; }).slice(0, MAX_COLUMNS);
    state._pendingCols = null;
    state.columns = ids.map(function(id){ return newColumn(id); });
  }
  if (!state.columns.length && state.order.length){
    state.columns = state.order.slice(0, Math.min(DEFAULT_OPEN, state.order.length)).map(function(id){ return newColumn(id); });
  }
}

/* =========================================================================
   테스트 훅 + 부팅
   ========================================================================= */
// 테스트 훅은 로컬(테스트 서버)에서만 노출 — 아임웹/GitHub Pages 프로덕션 전역 오염 방지
if (/^(localhost|127\.0\.0\.1|\[?::1\]?)$/.test(location.hostname) || location.protocol === 'file:'){
  window.__lawapp = {
    state: state,
    parseLaw: parseLaw, normalizeWithMap: normalizeWithMap, buildQuery: buildQuery,
    matchRow: matchRow, mergeRanges: mergeRanges, buildHighlightHtml: buildHighlightHtml,
    safeHttpUrl: safeHttpUrl, lawSourceUrl: lawSourceUrl,
    computeResults: computeResults, setQuery: setQuery, setSearchMode: setSearchMode, toggleResults: toggleResults,
    openResult: openResult, openLaw: openLaw, toggleLawColumn: toggleLawColumn, closeColumn: closeColumn,
    findColumnWithLaw: findColumnWithLaw, lawColor: lawColor, lawAbbr: lawAbbr,
    setColumns: function(ids){ state.columns = (ids||[]).filter(function(id){ return state.laws[id]; }).map(function(id){ return newColumn(id); }); renderColumns(); renderLawBadges(); saveUiState(); },
    CONFIG: CONFIG
  };
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();

})();
</script>
